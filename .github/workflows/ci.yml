name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Flink JARs
        working-directory: flink-jobs
        run: ./gradlew buildAllJars

      - name: Run smoke tests
        working-directory: flink-jobs
        run: ./gradlew test

  infra-smoketest:
    name: Infrastructure Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Flink JARs
        working-directory: flink-jobs
        run: ./gradlew buildAllJars

      - name: Start services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Kafka..."
          for i in $(seq 1 60); do
            docker compose ps kafka | grep -q "Up" && break
            sleep 2
          done

          echo "Waiting for SeaweedFS..."
          for i in $(seq 1 30); do
            docker compose ps minio | grep -q "healthy" && break
            sleep 2
          done

          echo "Waiting for Flink JobManager..."
          for i in $(seq 1 30); do
            docker exec flink-jobmanager curl -sf http://localhost:8081/overview > /dev/null 2>&1 && break
            sleep 2
          done

          echo "Waiting for Iceberg REST..."
          for i in $(seq 1 30); do
            docker compose ps iceberg-rest | grep -q "Up" && break
            sleep 2
          done

          echo "Waiting for Trino..."
          for i in $(seq 1 60); do
            docker exec trino-coordinator trino --server localhost:8080 --catalog iceberg --execute "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
        timeout-minutes: 5

      - name: Smoke test - all containers running
        run: |
          FAILED=0
          for svc in kafka minio flink-jobmanager flink-taskmanager iceberg-rest trino-coordinator superset data-generator flink-sql-client; do
            if docker compose ps "$svc" | grep -q "Up"; then
              echo "✓ $svc"
            else
              echo "✗ $svc - NOT RUNNING"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] || exit 1

      - name: Smoke test - S3 bucket exists
        run: |
          docker run --rm --network flink-trino-superset-pipeline_pipeline-network \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli --endpoint-url http://minio:9000 s3 ls s3://warehouse/

      - name: Smoke test - Trino can query
        run: |
          docker exec trino-coordinator trino --server localhost:8080 --catalog iceberg \
            --execute "CREATE SCHEMA IF NOT EXISTS iceberg.warehouse"
          docker exec trino-coordinator trino --server localhost:8080 --catalog iceberg \
            --execute "SELECT 1 AS healthy"

      - name: Smoke test - data generator producing
        run: |
          docker logs data-generator 2>&1 | grep -q "Generated" || \
            (echo "Data generator not producing"; exit 1)

      - name: Collect logs on failure
        if: failure()
        run: |
          for svc in kafka minio flink-jobmanager flink-taskmanager iceberg-rest trino-coordinator superset data-generator; do
            echo "=== $svc ==="
            docker logs "$svc" 2>&1 | tail -30
            echo ""
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
