version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: gradle
    directory: /flink-jobs
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      flink:
        patterns: ["org.apache.flink*"]
      iceberg:
        patterns: ["org.apache.iceberg*"]
      jackson:
        patterns: ["com.fasterxml.jackson*"]

  # Python dependencies (uv/pyproject.toml)
  - package-ecosystem: uv
    directory: /data-generator
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3

  # Docker images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /flink
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /superset
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /data-generator
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
