name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flink-jobs:
    name: Flink Jobs - Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: disabled

      - name: Build Flink JARs
        working-directory: flink-jobs
        run: ./gradlew buildAllJars

      - name: Run smoke tests
        working-directory: flink-jobs
        run: ./gradlew test

  data-generator:
    name: Data Generator - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data-generator
        run: pip install -r requirements.txt

      - name: Run smoke tests
        working-directory: data-generator
        run: python -m pytest test_data_generator.py -v
