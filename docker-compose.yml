services:
  # Kafka - Message broker for data ingestion in KRaft mode
  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      - PATH=/opt/kafka/bin:$PATH
      # KRaft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Additional settings
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
    networks:
      - pipeline-network
  # SeaweedFS - S3-compatible storage for Iceberg data (replaces MinIO)
  # See: https://rmoff.net/2026/01/14/alternatives-to-minio-for-single-node-local-s3/
  minio:
    image: chrislusf/seaweedfs:latest@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"   # S3 API (same port as MinIO for compatibility)
      - "9001:9333"   # SeaweedFS Master UI
    command: "server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.port=9333 -volume.port=8080 -filer -filer.port=8888"
    volumes:
      - minio-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:9333/cluster/status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-network

  # Create S3 bucket for Iceberg warehouse
  s3-setup:
    image: amazon/aws-cli:latest@sha256:b6aeb95d19d7f5a8cae4eb814cb16739b6b2a4f2f46f427ada6a8c9a20d9881d
    container_name: s3-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls 2>/dev/null; do echo '...waiting for S3...' && sleep 2; done;
      aws --endpoint-url http://minio:9000 s3 mb s3://warehouse 2>/dev/null || true;
      echo 'Bucket warehouse created';
      "
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - pipeline-network

  # Flink JobManager - Manages Flink jobs
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        heartbeat.interval: 1000
        heartbeat.timeout: 5000
        rest.flamegraph.enabled: true
        web.upload.dir: /tmp/flink-web-upload
        classloader.resolve-order: parent-first
        classloader.parent-first-patterns.default: org.apache.flink.table.factories.Factory,org.apache.iceberg.
    volumes:
      - ./flink-jobs:/opt/flink/usrlib
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/overview" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pipeline-network

  # Flink TaskManager - Executes Flink tasks
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        heartbeat.interval: 1000
        heartbeat.timeout: 5000
        classloader.resolve-order: parent-first
        classloader.parent-first-patterns.default: org.apache.flink.table.factories.Factory,org.apache.iceberg.
    volumes:
      - ./flink-jobs:/opt/flink/usrlib
    networks:
      - pipeline-network

  # Iceberg REST Catalog - Metadata service for Iceberg tables
  iceberg-rest:
    image: tabulario/iceberg-rest@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    networks:
      - pipeline-network
    depends_on:
      - minio

  # Trino Coordinator - SQL query engine
  trino-coordinator:
    image: trinodb/trino:latest@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    container_name: trino-coordinator
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
    networks:
      - pipeline-network
    depends_on:
      - iceberg-rest
      - minio

  # Superset - Data visualization
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset
    depends_on:
      - trino-coordinator
    ports:
      - "8088:8088"
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@superset.com
      - ADMIN_PASSWORD=admin
      - SUPERSET_SECRET_KEY="pmFmur1eluMiQDoZA+cGHhY/cA8+0+Ko7EZi5afhXWlH1oH/rQkVHNVOY1hRXAUi"
      - TALISMAN_ENABLED="False"
    volumes:
      - superset-data:/app/superset_home
    networks:
      - pipeline-network

  # Data generator - Produces sample data to Kafka
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: data-generator
    depends_on:
      - kafka
    environment:
      # Use 'local' for local development or 'cloud' for Confluent Cloud
      KAFKA_ENV: local
      # These environment variables are used as fallbacks if config files are missing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_ACTIVITY_TOPIC: user-activity
      KAFKA_SENSOR_DATA_TOPIC: sensor-data
    volumes:
      - ./config:/app/config
    restart: on-failure
    networks:
      - pipeline-network

  # Flink SQL Client - For executing SQL queries on Flink
  flink-sql-client:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-sql-client
    command: bin/sql-client.sh
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        classloader.resolve-order: parent-first
    volumes:
      - ./flink-jobs:/opt/flink-sql-client/scripts
    networks:
      - pipeline-network
    tty: true
    stdin_open: true

networks:
  pipeline-network:

volumes:
  kafka-data:
  minio-data:
  superset-data:
